<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Douyin Spark Fusion</title>
<script src="/static/vue.js"></script>
<link rel="stylesheet" href="/static/css/variables.css">
<link rel="stylesheet" href="/static/css/animations.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div id="app">
<div class="app-shell" v-if="!isLoginPage">
<aside class="sidebar">
<div class="logo" @click="page='dashboard'">spark</div>
<nav class="nav-links">
<a class="nav-item" :class="{active:page==='dashboard'}" @click="page='dashboard'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
<span class="nav-label">首页</span></a>
<a class="nav-item" :class="{active:page==='accounts'}" @click="page='accounts'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
<span class="nav-label">账号</span></a>
<a class="nav-item" :class="{active:page==='friends'}" @click="page='friends'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
<span class="nav-label">好友</span></a>
<a class="nav-item" :class="{active:page==='tasks'}" @click="page='tasks'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
<span class="nav-label">任务</span></a>
<a class="nav-item" :class="{active:page==='settings'}" @click="page='settings'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
<span class="nav-label">设置</span></a>
<a class="nav-item" v-if="user.is_admin" href="https://mail.hims.ccwu.cc" target="_blank" rel="noopener">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
<span class="nav-label">邮箱</span></a>
</nav>
<div class="sidebar-footer">
<div class="user-info">
<span class="user-role" v-if="user.is_admin">Admin</span>
<span class="user-name">{{ user.username }}</span>
</div>
<a class="nav-item" @click="logout">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
<span class="nav-label">退出</span></a>
</div>
</aside>
<main class="main-content">
<dashboard v-if="page==='dashboard'" :data="stats" :logs="logList" @refresh="loadStats"></dashboard>
<accounts-page v-if="page==='accounts'" :accounts="accountsList" @refresh="loadAccounts" @upload="uploadCookies"></accounts-page>
<friends-page v-if="page==='friends'" :accounts="accountsList" :friends="friendList" @sync="syncFriends" @send="sendMessage"></friends-page>
<tasks-page v-if="page==='tasks'" :accounts="accountsList" :tasks="taskList" :friends="friendList" @refresh="loadTasks" @create="createTask" @delete="deleteTask" @run="runTask"></tasks-page>
<settings-page v-if="page==='settings'" @save="saveSettings"></settings-page>
</main>
</div>
<login-page v-else @login="onLogin"></login-page>
<button class="theme-toggle" @click="toggleTheme" :title="theme==='light'?'暗色模式':'亮色模式'">{{ theme==='light' ? '🌙' : '☀️' }}</button>
<div v-if="toast.show" class="toast" :class="'toast-'+toast.type">{{ toast.msg }}</div>
<div v-if="appError" class="error-boundary"><div class="card"><h3>应用错误</h3><p class="text-muted">{{ appError }}</p><button class="btn-primary" @click="appError=''">关闭</button></div></div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/store.js"></script>
<script>
const appError=ref('');
const app = createApp({setup(){
onMounted(()=>{restoreSession()});
onErrorCaptured(err=>{appError.value=err.message||'未知错误';console.error('App error:',err);return false});
return{page,user,theme,version,appError,stats,logList,accountsList,friendList,taskList,historyList,isLoginPage,toast,showToast,toggleTheme,logout,onLogin,loadStats,loadAccounts,loadFriends,loadTasks,loadHistory,uploadCookies,syncFriends,sendMessage,createTask,deleteTask,runTask,saveSettings};
}});

app.component('login-page',{template:`
<div class="login-page"><div class="login-card"><div class="brand">spark</div>
<form class="form" @submit.prevent="submit">
<input v-model="username" placeholder="用户名" autofocus autocomplete="username"/>
<input v-model="password" type="password" placeholder="密码" autocomplete="current-password"/>
<input v-if="isReg" v-model="confirmPassword" type="password" placeholder="确认密码" autocomplete="new-password"/>
<input v-if="isReg" v-model="inviteCode" placeholder="邀请码（选填）"/>
<button type="submit" :disabled="loading"><span v-if="loading">...</span><span v-else>{{isReg?'注册':'登录'}}</span></button>
</form>
<p class="toggle"><a @click="isReg=!isReg">{{isReg?'已有账号？登录':'没有账号？注册'}}</a></p>
<p v-if="error" class="error">{{error}}</p>
</div></div>`,
setup(props,{emit}){const username=ref(''),password=ref(''),confirmPassword=ref(''),inviteCode=ref(''),loading=ref(false),error=ref(''),isReg=ref(false);
const submit=async()=>{if(!username.value||!password.value)return;loading.value=true;error.value='';try{if(isReg.value&&password.value!==confirmPassword.value){error.value='两次密码不一致';loading.value=false;return}const url=isReg.value?'/auth/register':'/auth/login';const body={username:username.value,password:password.value};if(isReg.value){body.confirm_password=confirmPassword.value;body.invite_code=inviteCode.value}const r=await api.post(url,body);if(r.data.token){localStorage.setItem('token',r.data.token);localStorage.setItem('user',JSON.stringify(r.data.user));emit('login',r.data.user)}else{error.value=r.data.detail||'操作失败'}}catch(e){error.value='网络错误'}finally{loading.value=false}};
return{username,password,confirmPassword,inviteCode,loading,error,isReg,submit}}});

app.component('dashboard',{props:['data','logs'],emits:['refresh'],template:`
<div><h2 class="page-title">首页</h2>
<div class="stats-grid">
<div class="stat-card" v-for="(s,i) in statsList" :key="s.key" :style="{animationDelay:i*0.08+'s'}"><div class="stat-value">{{data[s.key]}}</div><div class="stat-label">{{s.label}}</div></div>
</div>
<div class="card mt-6"><h3 class="card-title">系统资源</h3>
<div class="mt-3" style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font-size:13px"><span>CPU</span><span :class="status.cpu_percent>80?'text-red':''">{{status.cpu_percent}}%</span></div>
<div style="width:100%;height:6px;background:var(--bg-hover);border-radius:3px"><div :style="{width:status.cpu_percent+'%',height:'100%',background:status.cpu_percent>80?'var(--red)':'var(--green)',borderRadius:'3px',transition:'width .3s'}"></div></div>
<div style="display:flex;justify-content:space-between;font-size:13px"><span>内存</span><span :class="status.memory_percent>80?'text-red':''">{{status.memory_percent}}% ({{status.memory_used_gb}}/{{status.memory_total_gb}} GB)</span></div>
<div style="width:100%;height:6px;background:var(--bg-hover);border-radius:3px"><div :style="{width:status.memory_percent+'%',height:'100%',background:status.memory_percent>80?'var(--red)':'var(--green)',borderRadius:'3px',transition:'width .3s'}"></div></div>
<div style="display:flex;justify-content:space-between;font-size:13px"><span>磁盘</span><span :class="status.disk_percent>80?'text-red':''">{{status.disk_percent}}% ({{status.disk_free_gb}} GB 可用)</span></div>
<div style="width:100%;height:6px;background:var(--bg-hover);border-radius:3px"><div :style="{width:status.disk_percent+'%',height:'100%',background:status.disk_percent>80?'var(--red)':'var(--green)',borderRadius:'3px',transition:'width .3s'}"></div></div>
</div></div>
<div class="card mt-4"><h3 class="card-title">发送统计</h3>
<div class="mt-3" style="display:flex;gap:24px;font-size:13px"><div><span class="text-muted">今日发送: </span><span>{{status.today_sent}}</span></div><div><span class="text-muted">成功率: </span><span>{{status.today_total>0?Math.round(status.today_sent/status.today_total*100):0}}%</span></div><div><span class="text-muted">限流次数: </span><span :class="status.rate_limited>0?'text-red':''">{{status.rate_limited}}</span></div></div></div>
<div class="card mt-4"><h3 class="card-title">会话状态</h3>
<div class="mt-3" style="display:flex;gap:24px;font-size:13px"><div><span class="text-muted">Cookie: </span><span class="badge" :class="status.cookie_valid?'badge-green':'badge-red'">{{status.cookie_valid?'有效':'无效'}}</span></div><div><span class="text-muted">运行时间: </span><span>{{status.uptime_hours}} 小时</span></div></div></div>
<div class="card mt-6"><h3 class="card-title">最近日志</h3>
<table class="table mt-3" v-if="logs.length"><thead><tr><th>时间</th><th>状态</th><th>消息</th></tr></thead><tbody><tr v-for="l in logs" :key="l.id"><td class="text-muted">{{(l.created_at||'').replace('T',' ').substring(0,19)}}</td><td><span class="badge" :class="l.status==='success'?'badge-green':'badge-red'">{{l.status==='success'?'成功':'失败'}}</span></td><td class="text-muted">{{l.message}}</td></tr></tbody></table>
<p v-else class="text-muted mt-3">暂无日志</p></div></div>`,
setup(){const statsList=[{label:'账号',key:'accounts'},{label:'好友',key:'friends'},{label:'活跃任务',key:'tasks'},{label:'今日发送',key:'today_sent'}];
const status=reactive({cpu_percent:0,memory_percent:0,memory_used_gb:0,memory_total_gb:0,disk_percent:0,disk_free_gb:0,uptime_hours:0,today_sent:0,today_total:0,rate_limited:0,cookie_valid:false});
const fetchStatus=async()=>{try{const r=await api.get('/status');if(r.data)Object.assign(status,r.data)}catch(e){}};
onMounted(()=>{fetchStatus();setInterval(fetchStatus,300000)});
return{statsList,status}}});

app.component('accounts-page',{props:['accounts'],emits:['refresh','upload'],template:`
<div><div class="page-header"><h2 class="page-title">账号管理</h2><div style="display:flex;gap:8px"><button class="btn-primary" @click="addAccount">+ 添加账号</button><button class="btn-secondary" @click="startQrLogin" :disabled="qrScanning">{{qrScanning?'扫码中...':'扫码登录'}}</button></div></div>
<div v-if="accounts.length" class="mt-4"><div class="card" v-for="a in accounts" :key="a.id" style="margin-bottom:12px">
<div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-weight:500;font-size:14px">{{a.name}}</div><div style="display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px"><span v-if="a.phone" class="text-muted">{{a.phone}}</span><span class="badge" :class="a.cookies&&a.cookies!=='[]'?'badge-green':'badge-amber'">{{a.cookies&&a.cookies!=='[]'?'已登录':'未登录'}}</span></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-secondary btn-sm" @click="importCookie(a.id)">导入Cookie</button><button class="btn-danger btn-sm" @click="delAccount(a.id)">删除</button></div></div>
<div v-if="showCookie===a.id" style="margin-top:12px"><textarea v-model="cookieJson" placeholder="粘贴 Cookie JSON 数组" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:12px;resize:vertical"></textarea>
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn-primary btn-sm" @click="saveCookie(a.id)">保存</button><button class="btn-secondary btn-sm" @click="showCookie=null">取消</button></div></div></div></div>
<p v-else class="text-muted mt-4">点击"添加账号"开始</p>
<div v-if="qrShow" class="error-boundary" style="background:rgba(0,0,0,.6)"><div class="card" style="max-width:360px;text-align:center"><h3 class="card-title">扫码登录</h3><div v-if="qrImage" style="margin:12px 0"><img :src="'data:image/png;base64,'+qrImage" style="width:200px;height:200px;border:1px solid var(--border);border-radius:8px"/></div><div v-else class="text-muted" style="padding:40px;font-size:13px">加载中...</div><p class="text-muted" style="font-size:12px;margin-top:8px">{{qrStatus}}</p><button class="btn-secondary btn-sm" @click="qrShow=false;stopQrPoll()" style="margin-top:8px">取消</button></div></div>
<div v-if="isAdmin" class="mt-6"><div style="border-top:1px solid var(--border);margin-bottom:16px;padding-top:16px"><h3 class="card-title">批量账号管理</h3></div>
<div class="card" style="padding:12px 16px">
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<label class="friend-item" :class="{checked:allChecked}" style="font-size:12px;padding:4px 8px"><input type="checkbox" :checked="allChecked" @change="toggleAll" style="width:auto;margin:0"/> 全选</label>
<button class="btn-danger btn-sm" @click="batchDelete" :disabled="checkedIds.length===0">删除选中 ({{checkedIds.length}})</button>
<button class="btn-secondary btn-sm" @click="batchToggle(true)" :disabled="checkedIds.length===0">启用选中</button>
<button class="btn-secondary btn-sm" @click="batchToggle(false)" :disabled="checkedIds.length===0">禁用选中</button>
<input v-model="search" placeholder="搜索账号/用户" style="width:200px;margin-left:auto"/>
</div></div>
<div v-if="adminRows.length" class="card mt-4" style="padding:0"><table class="table"><thead><tr><th style="width:40px"></th><th>ID</th><th>所属用户</th><th>账号名</th><th>手机号</th><th>登录状态</th><th>活跃状态</th><th>操作</th></tr></thead><tbody><tr v-for="a in filtered" :key="a.id"><td><input type="checkbox" :checked="checkedIds.includes(a.id)" @change="toggleCheck(a.id)" style="width:auto;margin:0"/></td><td class="text-muted">{{a.id}}</td><td>{{a.owner_username||'—'}}</td><td>{{a.name}}</td><td class="text-muted">{{a.phone||'—'}}</td><td><span class="badge" :class="a.cookies&&a.cookies!=='[]'?'badge-green':'badge-amber'">{{a.cookies&&a.cookies!=='[]'?'已登录':'未登录'}}</span></td><td><span class="badge" :class="a.is_active!==0?'badge-green':'badge-red'">{{a.is_active!==0?'活跃':'已禁用'}}</span></td><td><div style="display:flex;gap:4px"><button class="btn-danger btn-sm" @click="delOne(a.id)">删除</button><button class="btn-secondary btn-sm" @click="toggleOne(a.id,a.is_active!==0)">{{a.is_active!==0?'禁用':'启用'}}</button></div></td></tr></tbody></table></div>
<p v-else class="text-muted mt-4">暂无账号</p></div></div>`,
setup(props,{emit}){const showCookie=ref(null),cookieJson=ref('');
const isAdmin=computed(()=>user.value.is_admin);
const adminRows=ref([]),checkedIds=ref([]),search=ref('');
const allChecked=computed(()=>{const f=filtered.value;return f.length>0&&f.every(a=>checkedIds.value.includes(a.id))});
const filtered=computed(()=>{if(!search.value)return adminRows.value;const s=search.value.toLowerCase();return adminRows.value.filter(a=>(a.name||'').toLowerCase().includes(s)||(a.owner_username||'').toLowerCase().includes(s)||(a.phone||'').includes(s))});
const addAccount=async()=>{try{await api.post('/accounts',{name:'账号 '+(props.accounts.length+1),phone:''});emit('refresh')}catch(e){}};
const delAccount=async(id)=>{if(!confirm('确认删除？'))return;await api.del('/accounts/'+id);emit('refresh')};
const importCookie=(id)=>{showCookie.value=id;cookieJson.value=''};
const saveCookie=async(id)=>{try{const c=JSON.parse(cookieJson.value);const r=await api.post('/accounts/'+id+'/cookies',{cookies:c});showToast(r.data?.nickname?'Cookie上传成功，昵称: '+r.data.nickname:'Cookie上传成功');showCookie.value=null;cookieJson.value='';emit('refresh')}catch(e){alert('JSON格式错误')}};
const loadAdminAccounts=async()=>{try{const r=await api.get('/admin/accounts');adminRows.value=r.data||[]}catch(e){}};
const toggleCheck=id=>{if(checkedIds.value.includes(id))checkedIds.value=checkedIds.value.filter(i=>i!==id);else checkedIds.value=[...checkedIds.value,id]};
const toggleAll=()=>{if(allChecked.value)checkedIds.value=[];else checkedIds.value=filtered.value.map(a=>a.id)};
const batchDelete=async()=>{if(!confirm('确认删除'+checkedIds.value.length+'个账号？'))return;try{await api.post('/admin/accounts/batch-delete',{account_ids:checkedIds.value});checkedIds.value=[];emit('refresh');loadAdminAccounts();}catch(e){}};
const batchToggle=async(active)=>{try{await api.post('/admin/accounts/batch-toggle',{account_ids:checkedIds.value,is_active:active});checkedIds.value=[];emit('refresh');loadAdminAccounts();}catch(e){}};
const delOne=async(id)=>{if(!confirm('确认删除？'))return;try{await api.post('/admin/accounts/batch-delete',{account_ids:[id]});emit('refresh');loadAdminAccounts();}catch(e){}};
const toggleOne=async(id,cur)=>{try{await api.post('/admin/accounts/batch-toggle',{account_ids:[id],is_active:!cur});emit('refresh');loadAdminAccounts();}catch(e){}};
const qrShow=ref(false),qrImage=ref(''),qrToken=ref(''),qrStatus=ref(''),qrScanning=ref(false),qrTimer=ref(null);
const startQrLogin=async()=>{qrScanning.value=true;qrShow.value=true;qrImage.value='';qrStatus.value='正在获取二维码...';try{const r=await api.get('/accounts/qr-login');if(r.data?.qr_b64){qrImage.value=r.data.qr_b64;qrToken.value=r.data.token;qrStatus.value='请使用抖音 App 扫描二维码';qrPoll()}else{qrStatus.value='获取二维码失败';qrScanning.value=false}}catch(e){qrStatus.value='网络错误';qrScanning.value=false}};
const qrPoll=()=>{qrTimer.value=setInterval(async()=>{if(!qrToken.value)return;try{const r=await api.post('/accounts/qr-login/'+qrToken.value+'/save',{});if(r.data?.success){qrStatus.value='登录成功！'+r.data.nickname||'';clearInterval(qrTimer.value);qrTimer.value=null;qrShow.value=false;qrScanning.value=false;emit('refresh')}}catch(e){}},2000)};
const stopQrPoll=()=>{if(qrTimer.value){clearInterval(qrTimer.value);qrTimer.value=null}qrScanning.value=false};
onMounted(()=>{if(isAdmin.value)loadAdminAccounts()});
return{showCookie,cookieJson,addAccount,delAccount,importCookie,saveCookie,isAdmin,adminRows,checkedIds,search,allChecked,filtered,toggleCheck,toggleAll,batchDelete,batchToggle,delOne,toggleOne,qrShow,qrImage,qrStatus,qrScanning,startQrLogin,stopQrPoll}}});

app.component('friends-page',{props:['accounts','friends'],emits:['sync','send'],template:`
<div><div class="page-header"><h2 class="page-title">好友列表</h2><div class="header-actions"><select v-model="selectedAccount" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none"><option :value="0">选择账号</option><option v-for="a in accounts" :key="a.id" :value="a.id">{{a.name}}</option></select><button class="btn-secondary" @click="doSync" :disabled="!selectedAccount||syncing">{{syncing?'同步中...':'同步好友'}}</button></div></div>
<div v-if="!selectedAccount" class="text-muted mt-4">请先选择账号</div>
<div v-else-if="friends.length===0" class="text-muted mt-4">暂无好友，请点击"同步好友"</div>
<div v-if="syncError" class="text-red mt-3" style="padding:8px 12px;border:1px solid var(--red);border-radius:6px;background:rgba(220,38,38,.05)">{{syncError}}</div>
<div v-else class="mt-4"><div class="friend-grid"><div class="friend-card stagger-item" v-for="(f,i) in friends" :key="f.id" :style="{animationDelay:i*0.04+'s'}"><div class="friend-row"><div class="friend-name">{{f.name}}</div><div class="friend-meta"><span class="badge badge-amber" v-if="f.spark_days">{{f.spark_days}}天</span><button class="btn-primary btn-sm" @click="doSend(f.name)" :disabled="sending===f.name">{{sending===f.name?'发送中':'发送'}}</button></div></div><p v-if="results[f.name]" class="result" :class="results[f.name]?'text-green':'text-red'">{{results[f.name]}}</p></div></div></div></div>`,
setup(props,{emit}){const selectedAccount=ref(0),sending=ref(''),syncing=ref(false),results=reactive({}),syncError=ref('');
const doSync=async()=>{if(!selectedAccount.value)return;syncing.value=true;syncError.value='';try{const r=await api.post('/friends/sync',{account_id:selectedAccount.value});if(r.data?.success){showToast('同步完成');loadFriends(selectedAccount.value)}else{syncError.value=r.data?.error||'同步失败';showToast(syncError.value,'error')}}catch(e){syncError.value='网络错误';showToast('网络错误','error')}finally{syncing.value=false}};
const doSend=async(name)=>{sending.value=name;try{const r=await api.post('/messages/send',{account_id:selectedAccount.value,friend_name:name,message:'续火花🔥'});results[name]=r.data?.success?'已发送':'发送失败'}catch(e){results[name]='失败'}finally{sending.value=''}};
return{selectedAccount,sending,syncing,results,syncError,doSync,doSend}}});

app.component('tasks-page',{props:['accounts','tasks','friends'],emits:['refresh','create','delete','run'],template:`
