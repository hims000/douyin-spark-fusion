<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Douyin Spark Fusion</title>
<script src="https://unpkg.com/vue@3.5/dist/vue.global.prod.js"></script>
<style>
:root{--bg:#fafafa;--bg-card:#fff;--bg-hover:#f5f5f5;--border:#e5e5e5;--text:#0a0a0a;--text-muted:#737373;--accent:#0a0a0a;--green:#16a34a;--red:#dc2626;--amber:#d97706;--radius:8px}
[data-theme="dark"]{--bg:#0a0a0a;--bg-card:#1a1a1a;--bg-hover:#262626;--border:#333;--text:#fafafa;--text-muted:#a3a3a3;--accent:#fafafa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
input,button,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
input,select{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
button{cursor:pointer;border:none;border-radius:var(--radius);padding:8px 16px;font-weight:500;font-size:13px;transition:all .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--text);color:var(--bg)}.btn-primary:hover{background:var(--text-muted)}
.btn-secondary{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg-hover)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(220,38,38,.3)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 12px;font-size:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-green{background:rgba(22,163,74,.08);color:var(--green)}
.badge-red{background:rgba(220,38,38,.08);color:var(--red)}
.badge-amber{background:rgba(217,119,6,.08);color:var(--amber)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.table th{color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.table tbody tr{transition:background .1s}.table tbody tr:hover td{background:var(--bg-hover)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stagger-item{animation:fadeInUp .3s ease both}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:200px;min-height:100vh;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0 12px;flex-shrink:0}
.logo{padding:20px 12px 16px;font-size:16px;font-weight:600;letter-spacing:-.02em;cursor:pointer;user-select:none}
.nav-links{flex:1;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:13px;transition:all .15s;cursor:pointer}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--bg-hover);color:var(--text)}
.nav-icon{display:flex;align-items:center;flex-shrink:0;opacity:.6}
.nav-item:hover .nav-icon,.nav-item.active .nav-icon{opacity:1}
.nav-icon svg{width:16px;height:16px}
.sidebar-footer{padding:12px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.user-info{padding:4px 12px 8px;display:flex;flex-direction:column}
.user-role{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.user-name{font-size:13px}
.main-content{flex:1;padding:32px 40px;overflow-y:auto;max-width:1024px}
.page-title{font-size:18px;font-weight:600;letter-spacing:-.02em}
.page-header{display:flex;justify-content:space-between;align-items:center}
.header-actions{display:flex;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;animation:fadeInUp .4s ease both;transition:transform .2s,box-shadow .2s,border-color .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06);border-color:#d4d4d4}
.stat-value{font-size:28px;font-weight:600;letter-spacing:-.02em}
.stat-label{color:var(--text-muted);font-size:13px;margin-top:4px}
.card-title{font-size:14px;font-weight:600}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-4{margin-bottom:16px}
.text-muted{color:var(--text-muted)}.text-green{color:var(--green)}.text-red{color:var(--red)}
.friend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.friend-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:transform .15s,box-shadow .15s,border-color .15s}
.friend-card:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.05);border-color:#d4d4d4}
.friend-row{display:flex;justify-content:space-between;align-items:center}
.friend-name{font-weight:500;font-size:14px}
.friend-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.form-grid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cron-picker{display:flex;gap:6px;align-items:center}
.time-input{width:50px;text-align:center}
.full-width{flex:1;min-width:200px}
.friend-header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.friend-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;transition:all .15s}
.friend-item.checked{background:var(--bg-hover);border-color:var(--text)}
.friend-item input[type=checkbox]{width:auto;margin:0}
.result{font-size:12px;margin-top:4px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.login-card{width:320px;position:relative;animation:cardIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.brand{font-size:32px;font-weight:600;letter-spacing:-.04em;text-align:center;margin-bottom:36px}
.form{display:flex;flex-direction:column;gap:10px}
.form input{width:100%;padding:10px 14px}
.form button{width:100%;padding:10px;min-height:40px;display:flex;align-items:center;justify-content:center}
.toggle{text-align:center;margin-top:24px;font-size:13px}
.toggle a{color:var(--text-muted);cursor:pointer;transition:color .15s}
.toggle a:hover{color:var(--text)}
.error{text-align:center;color:var(--red);margin-top:16px;font-size:13px}
.theme-toggle{position:fixed;bottom:20px;right:20px;width:36px;height:36px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;z-index:100;transition:all .15s}
.theme-toggle:hover{transform:scale(1.1)}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;animation:slideIn .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:768px){.app-shell{flex-direction:column}.sidebar{width:100%;min-height:auto;flex-direction:row;align-items:center;padding:0 8px;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto}.logo{padding:12px 8px;font-size:14px;flex-shrink:0}.nav-links{flex-direction:row;flex:1;gap:0}.nav-item{padding:10px 10px;font-size:12px;gap:4px;white-space:nowrap}.nav-label{display:none}.nav-icon{opacity:1}.sidebar-footer{padding:0;border-top:none;flex-shrink:0;flex-direction:row}.sidebar-footer .nav-label{display:none}.user-info{display:none}.main-content{padding:16px;max-width:100%}.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}.friend-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div class="app-shell" v-if="!isLoginPage">
<aside class="sidebar">
<div class="logo" @click="page='dashboard'">spark</div>
<nav class="nav-links">
<a class="nav-item" :class="{active:page==='dashboard'}" @click="page='dashboard'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
<span class="nav-label">首页</span></a>
<a class="nav-item" :class="{active:page==='accounts'}" @click="page='accounts'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
<span class="nav-label">账号</span></a>
<a class="nav-item" :class="{active:page==='friends'}" @click="page='friends'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
<span class="nav-label">好友</span></a>
<a class="nav-item" :class="{active:page==='tasks'}" @click="page='tasks'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
<span class="nav-label">任务</span></a>
<a class="nav-item" :class="{active:page==='settings'}" @click="page='settings'">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
<span class="nav-label">设置</span></a>
</nav>
<div class="sidebar-footer">
<div class="user-info">
<span class="user-role" v-if="user.is_admin">Admin</span>
<span class="user-name">{{ user.username }}</span>
</div>
<a class="nav-item" @click="logout">
<span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
<span class="nav-label">退出</span></a>
</div>
</aside>
<main class="main-content">
<dashboard v-if="page==='dashboard'" :data="stats" :logs="logList" @refresh="loadStats"></dashboard>
<accounts-page v-if="page==='accounts'" :accounts="accountsList" @refresh="loadAccounts" @upload="uploadCookies"></accounts-page>
<friends-page v-if="page==='friends'" :accounts="accountsList" :friends="friendList" @sync="syncFriends" @send="sendMessage"></friends-page>
<tasks-page v-if="page==='tasks'" :accounts="accountsList" :tasks="taskList" :friends="friendList" @refresh="loadTasks" @create="createTask" @delete="deleteTask" @run="runTask"></tasks-page>
<settings-page v-if="page==='settings'" @save="saveSettings"></settings-page>
</main>
</div>
<login-page v-else @login="onLogin"></login-page>
<button class="theme-toggle" @click="toggleTheme" :title="theme==='light'?'暗色模式':'亮色模式'">{{ theme==='light' ? '🌙' : '☀️' }}</button>
<div v-if="toast.show" class="toast" :class="'toast-'+toast.type">{{ toast.msg }}</div>
</div>
<script>
const API = '/api';
const token = () => localStorage.getItem('token') || '';
const headers = () => ({'Content-Type':'application/json',Authorization:'Bearer '+token()});
const api = {get:url=>fetch(API+url,{headers:headers()}).then(r=>r.json().then(d=>({status:r.status,data:d}))),
post:(url,body)=>fetch(API+url,{method:'POST',headers:headers(),body:JSON.stringify(body)}).then(r=>r.json().then(d=>({status:r.status,data:d}))),
put:(url,body)=>fetch(API+url,{method:'PUT',headers:headers(),body:JSON.stringify(body)}).then(r=>r.json().then(d=>({status:r.status,data:d}))),
del:url=>fetch(API+url,{method:'DELETE',headers:headers()}).then(r=>r.json().then(d=>({status:r.status,data:d})))};

const {createApp,ref,reactive,computed,onMounted,watch,nextTick} = Vue;
const app = createApp({setup(){
const page=ref('dashboard'),user=ref({}),theme=ref(localStorage.getItem('theme')||'light'),toast=reactive({show:false,msg:'',type:'success'});
const stats=reactive({accounts:0,tasks:0,friends:0,today_sent:0}),logList=ref([]),accountsList=ref([]),friendList=ref([]),taskList=ref([]);
const isLoginPage=computed(()=>!user.value.username);
const showToast=(msg,type='success')=>{toast.show=true;toast.msg=msg;toast.type=type;setTimeout(()=>toast.show=false,3000)};
const toggleTheme=()=>{theme.value=theme.value==='light'?'dark':'light';localStorage.setItem('theme',theme.value);document.documentElement.setAttribute('data-theme',theme.value)};
const logout=()=>{localStorage.removeItem('token');localStorage.removeItem('user');user.value={};page.value='dashboard'};
const onLogin=(u)=>{user.value=u;page.value='dashboard';loadStats();loadAccounts()};
const loadStats=async()=>{try{const r=await api.get('/stats');Object.assign(stats,r.data);const l=await api.get('/logs?limit=20');logList.value=l.data||[]}catch(e){}};
const loadAccounts=async()=>{try{const r=await api.get('/accounts');accountsList.value=r.data||[]}catch(e){}};
const loadFriends=async(accId)=>{try{const r=await api.get('/friends?account_id='+accId);friendList.value=r.data||[]}catch(e){}};
const loadTasks=async()=>{try{const r=await api.get('/tasks');taskList.value=r.data||[]}catch(e){}};
const uploadCookies=async(accId,cookies)=>{try{await api.post('/accounts/'+accId+'/cookies',{cookies});showToast('Cookie上传成功');loadAccounts()}catch(e){showToast('上传失败','error')}};
const syncFriends=async(accId)=>{try{await api.post('/friends/sync',{account_id:accId});showToast('同步完成');loadFriends(accId)}catch(e){showToast('同步失败','error')}};
const sendMessage=async(accId,name,msg)=>{try{const r=await api.post('/messages/send',{account_id:accId,friend_name:name,message:msg||'续火花🔥'});showToast(r.data?.success?'发送成功':'发送失败',r.data?.success?'success':'error')}catch(e){showToast('发送失败','error')}};
const createTask=async(t)={try{await api.post('/tasks',t);showToast('任务创建成功');loadTasks()}catch(e){showToast('创建失败','error')}};
const deleteTask=async(id)=>{try{await api.del('/tasks/'+id);showToast('已删除');loadTasks()}catch(e){showToast('删除失败','error')}};
const runTask=async(id)=>{try{await api.post('/tasks/run/'+id);showToast('执行完成');loadTasks()}catch(e){showToast('执行失败','error')}};
const saveSettings=async(s)=>{try{await api.post('/settings',s);showToast('设置已保存')}catch(e){showToast('保存失败','error')}};
onMounted(()=>{document.documentElement.setAttribute('data-theme',theme.value);try{const u=JSON.parse(localStorage.getItem('user')||'{}');if(u.username){user.value=u;loadStats();loadAccounts()}}catch(e){}});
return{page,user,theme,stats,logList,accountsList,friendList,taskList,isLoginPage,toast,showToast,toggleTheme,logout,onLogin,loadStats,loadAccounts,loadFriends,loadTasks,uploadCookies,syncFriends,sendMessage,createTask,deleteTask,runTask,saveSettings};
}});

app.component('login-page',{template:`
<div class="login-page"><div class="login-card"><div class="brand">spark</div>
<form class="form" @submit.prevent="submit">
<input v-model="username" placeholder="用户名" autofocus autocomplete="username"/>
<input v-model="password" type="password" placeholder="密码" autocomplete="current-password"/>
<button type="submit" :disabled="loading"><span v-if="loading">...</span><span v-else>{{isReg?'注册':'登录'}}</span></button>
</form>
<p class="toggle"><a @click="isReg=!isReg">{{isReg?'已有账号？登录':'没有账号？注册'}}</a></p>
<p v-if="error" class="error">{{error}}</p>
</div></div>`,
setup(props,{emit}){const username=ref(''),password=ref(''),loading=ref(false),error=ref(''),isReg=ref(false);
const submit=async()=>{if(!username.value||!password.value)return;loading.value=true;error.value='';try{const url=isReg.value?'/auth/register':'/auth/login';const r=await api.post(url,{username:username.value,password:password.value});if(r.data.token){localStorage.setItem('token',r.data.token);localStorage.setItem('user',JSON.stringify(r.data.user));emit('login',r.data.user)}else{error.value=r.data.detail||'操作失败'}}catch(e){error.value='网络错误'}finally{loading.value=false}};
return{username,password,loading,error,isReg,submit}}});

app.component('dashboard',{props:['data','logs'],emits:['refresh'],template:`
<div><h2 class="page-title">首页</h2>
<div class="stats-grid">
<div class="stat-card" v-for="(s,i) in statsList" :key="s.key" :style="{animationDelay:i*0.08+'s'}"><div class="stat-value">{{data[s.key]}}</div><div class="stat-label">{{s.label}}</div></div>
</div>
<div class="card mt-6"><h3 class="card-title">最近日志</h3>
<table class="table mt-3" v-if="logs.length"><thead><tr><th>时间</th><th>状态</th><th>消息</th></tr></thead><tbody><tr v-for="l in logs" :key="l.id"><td class="text-muted">{{(l.created_at||'').replace('T',' ').substring(0,19)}}</td><td><span class="badge" :class="l.status==='success'?'badge-green':'badge-red'">{{l.status==='success'?'成功':'失败'}}</span></td><td class="text-muted">{{l.message}}</td></tr></tbody></table>
<p v-else class="text-muted mt-3">暂无日志</p></div></div>`,
setup(){const statsList=[{label:'账号',key:'accounts'},{label:'好友',key:'friends'},{label:'活跃任务',key:'tasks'},{label:'今日发送',key:'today_sent'}];return{statsList}}})

app.component('accounts-page',{props:['accounts'],emits:['refresh','upload'],template:`
<div><div class="page-header"><h2 class="page-title">账号管理</h2><button class="btn-primary" @click="addAccount">+ 添加账号</button></div>
<div v-if="accounts.length" class="mt-4"><div class="card" v-for="a in accounts" :key="a.id" style="margin-bottom:12px">
<div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-weight:500;font-size:14px">{{a.name}}</div><div style="display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px"><span v-if="a.phone" class="text-muted">{{a.phone}}</span><span class="badge" :class="a.cookies&&a.cookies!=='[]'?'badge-green':'badge-amber'">{{a.cookies&&a.cookies!=='[]'?'已登录':'未登录'}}</span></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-secondary btn-sm" @click="importCookie(a.id)">导入Cookie</button><button class="btn-danger btn-sm" @click="delAccount(a.id)">删除</button></div></div>
<div v-if="showCookie===a.id" style="margin-top:12px"><textarea v-model="cookieJson" placeholder="粘贴 Cookie JSON 数组" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:12px;resize:vertical"></textarea>
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn-primary btn-sm" @click="saveCookie(a.id)">保存</button><button class="btn-secondary btn-sm" @click="showCookie=null">取消</button></div></div></div></div>
<p v-else class="text-muted mt-4">点击"添加账号"开始</p></div>`,
setup(props,{emit}){const showCookie=ref(null),cookieJson=ref('');
const addAccount=async()=>{try{await api.post('/accounts',{name:'账号 '+(props.accounts.length+1),phone:''});emit('refresh')}catch(e){}};
const delAccount=async(id)=>{if(!confirm('确认删除？'))return;await api.del('/accounts/'+id);emit('refresh')};
const importCookie=(id)=>{showCookie.value=id;cookieJson.value=''};
const saveCookie=async(id)=>{try{const c=JSON.parse(cookieJson.value);emit('upload',id,c);showCookie.value=null;cookieJson.value=''}catch(e){alert('JSON格式错误')}};
return{showCookie,cookieJson,addAccount,delAccount,importCookie,saveCookie}}})

app.component('friends-page',{props:['accounts','friends'],emits:['sync','send'],template:`
<div><div class="page-header"><h2 class="page-title">好友列表</h2><div class="header-actions"><select v-model="selectedAccount" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none"><option :value="0">选择账号</option><option v-for="a in accounts" :key="a.id" :value="a.id">{{a.name}}</option></select><button class="btn-secondary" @click="$emit('sync',selectedAccount)" :disabled="!selectedAccount||syncing">{{syncing?'同步中...':'同步好友'}}</button></div></div>
<div v-if="!selectedAccount" class="text-muted mt-4">请先选择账号</div>
<div v-else-if="friends.length===0" class="text-muted mt-4">暂无好友，请点击"同步好友"</div>
<div v-else class="mt-4"><div class="friend-grid"><div class="friend-card stagger-item" v-for="(f,i) in friends" :key="f.id" :style="{animationDelay:i*0.04+'s'}"><div class="friend-row"><div class="friend-name">{{f.name}}</div><div class="friend-meta"><span class="badge badge-amber" v-if="f.spark_days">{{f.spark_days}}天</span><button class="btn-primary btn-sm" @click="doSend(f.name)" :disabled="sending===f.name">{{sending===f.name?'发送中':'发送'}}</button></div></div><p v-if="results[f.name]" class="result" :class="results[f.name]?'text-green':'text-red'">{{results[f.name]}}</p></div></div></div></div>`,
setup(props,{emit}){const selectedAccount=ref(0),sending=ref(''),syncing=ref(false),results=reactive({});
const doSend=async(name)=>{sending.value=name;try{await emit('send',selectedAccount.value,name);results[name]='已发送'}catch(e){results[name]='失败'}finally{sending.value=''}};
return{selectedAccount,sending,syncing,results,doSend}}})

app.component('tasks-page',{props:['accounts','tasks','friends'],emits:['refresh','create','delete','run'],template:`
<div><div class="page-header"><h2 class="page-title">定时任务</h2><button class="btn-primary" @click="showForm=true">+ 新建任务</button></div>
<div v-if="showForm" class="card mt-4"><h3 class="card-title">新建任务</h3>
<div class="form-grid mt-3"><select v-model="form.account_id" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none"><option :value="0">选择账号</option><option v-for="a in accounts" :key="a.id" :value="a.id">{{a.name}}</option></select>
<div class="cron-picker"><span class="text-muted" style="font-size:12px">定时</span><select v-model="cronPreset" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none"><option value="">自定义</option><option v-for="p in presets" :key="p.value" :value="p.value">{{p.label}}</option></select>
<template v-if="!cronPreset"><input v-model="cronHour" type="number" min="0" max="23" class="time-input" placeholder="时"/><span class="text-muted">:</span><input v-model="cronMin" type="number" min="0" max="59" class="time-input" placeholder="分"/></template>
<span class="text-muted" style="font-size:12px">{{cronPreset?'每天':'每天'}}</span></div>
<input v-model="form.message" placeholder="消息内容（留空随机）" class="full-width"/>
</div>
<div v-if="friendOptions.length" class="mt-3"><div class="friend-header"><span class="text-muted">选择好友</span><button class="btn-secondary btn-sm" @click="selectAll">全选</button><button class="btn-secondary btn-sm" @click="deselectAll">取消</button></div>
<div class="friend-grid"><label v-for="f in friendOptions" :key="f.name" class="friend-item" :class="{checked:selectedFriends.has(f.name)}"><input type="checkbox" :checked="selectedFriends.has(f.name)" @change="toggle(f.name)"/><span>{{f.name}}</span><span class="badge badge-amber" v-if="f.spark_days">{{f.spark_days}}天</span></label></div></div>
<div class="mt-3"><button class="btn-primary" @click="submit" :disabled="!form.account_id||selectedFriends.size===0">创建 ({{selectedFriends.size}}个)</button><button class="btn-secondary" @click="showForm=false">取消</button></div></div>
<table v-if="tasks.length" class="table mt-4"><thead><tr><th>账号</th><th>好友</th><th>Cron</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="t in tasks" :key="t.id"><td class="text-muted">{{t.account_name||'账号'+t.account_id}}</td><td>{{t.friend_name}}</td><td class="text-muted">{{t.cron_expr}}</td><td><span class="badge" :class="t.is_active?'badge-green':'badge-amber'">{{t.is_active?'活跃':'暂停'}}</span></td><td><div style="display:flex;gap:4px"><button class="btn-primary btn-sm" @click="$emit('run',t.id)">执行</button><button class="btn-danger btn-sm" @click="$emit('delete',t.id)">删除</button></div></td></tr></tbody></table>
<p v-else class="text-muted mt-4">暂无任务</p></div>`,
setup(props,{emit}){const showForm=ref(false),form=reactive({account_id:0,message:'',cron_expr:'0 9 * * *'}),cronPreset=ref('0 9 * * *'),cronHour=ref(9),cronMin=ref(0),selectedFriends=ref(new Set()),friendOptions=ref([]);
const presets=[{value:'0 8 * * *',label:'08:00'},{value:'0 9 * * *',label:'09:00'},{value:'0 10 * * *',label:'10:00'},{value:'0 12 * * *',label:'12:00'},{value:'0 18 * * *',label:'18:00'},{value:'0 20 * * *',label:'20:00'},{value:'0 21 * * *',label:'21:00'}];
const onPreset=()=>{if(cronPreset.value){form.cron_expr=cronPreset.value}else{form.cron_expr='0 '+cronMin.value+' '+cronHour.value+' * * *'}};
const toggle=(n)=>{if(selectedFriends.value.has(n))selectedFriends.value.delete(n);else selectedFriends.value.add(n);selectedFriends.value=new Set(selectedFriends.value)};
const selectAll=()=>{selectedFriends.value=new Set(friendOptions.value.map(f=>f.name))};
const deselectAll=()=>{selectedFriends.value=new Set()};
const submit=()=>{selectedFriends.value.forEach(name=>{emit('create',{account_id:form.account_id,friend_name:name,cron_expr:form.cron_expr,message:form.message})});showForm.value=false;selectedFriends.value=new Set()};
watch(()=>props.friends,(v)=>{if(v)friendOptions.value=v});
return{showForm,form,cronPreset,cronHour,cronMin,selectedFriends,friendOptions,presets,toggle,selectAll,deselectAll,submit,onPreset}}})
